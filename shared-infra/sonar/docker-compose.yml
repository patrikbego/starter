# Shared SonarQube server for all apps created from this starter.
#
# One server, many per-app project keys (see README "Project key convention").
# GUI:        http://<host>:9000   (default localhost)
# First boot: admin / admin, forced password change -> create a token.
#
# Based on the official SonarQube Docker sample (sq-with-postgres):
#   https://github.com/SonarSource/docker-sonarqube/tree/master/example-compose-files/sq-with-postgres
#
# Intentionally portable: no host-only sysctls, no host-path mounts.
# The SonarQube image is pinned to an exact immutable version.

services:
  sonarqube:
    image: ${SONARQUBE_IMAGE:-sonarqube:26.8.0.126808-community}
    hostname: sonarqube
    container_name: sonarqube
    read_only: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: ${POSTGRES_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-sonar}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    tmpfs:
      - /tmp:size=256M,mode=1777
    ports:
      - "${SONAR_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system/status"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  db:
    image: ${POSTGRES_IMAGE:-postgres:17}
    hostname: postgresql
    container_name: postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sonar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sonar}
      POSTGRES_DB: sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sonarqube_data:
  sonarqube_temp:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:
