# Production Cloud Run Deployment Profile
# Deployed to Cloud Run in starter-prod GCP project
#
# Environment variables set via Cloud Run secrets:
#   GCP_PROJECT_ID=starter-prod
#   OPENAI_API_KEY
#   STARTER_CORS_ALLOWED_ORIGINS
#   ACTUATOR_PASSWORD

server:
  port: ${PORT:8080}

spring:
  config:
    activate:
      on-profile: prod

  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID:starter-prod}
      firestore:
        enabled: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          model: openai/gpt-4o-mini
          temperature: 0.7

firebase:
  enabled: true

starter:
  cors:
    allowed-origins: ${STARTER_CORS_ALLOWED_ORIGINS}

spring.security.user:
  name: admin
  password: ${ACTUATOR_PASSWORD}
  roles: ADMIN

logging:
  level:
    root: WARN
    com.starter: INFO
    org.springframework.security: WARN
