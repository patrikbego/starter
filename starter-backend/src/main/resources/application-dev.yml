# DEV Cloud Run Deployment Profile
# Deployed to Cloud Run in starter-dev GCP project
#
# Required environment variables for Cloud Run:
#   GCP_PROJECT_ID
#   OPENAI_API_KEY
#   STARTER_CORS_ALLOWED_ORIGINS
#   ACTUATOR_PASSWORD

server:
  port: ${PORT:8080}

spring:
  config:
    activate:
      on-profile: dev

  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID:starter-dev}
      firestore:
        enabled: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          model: openai/gpt-4o-mini
          temperature: 0.7

firebase:
  enabled: true

starter:
  cors:
    allowed-origins: ${STARTER_CORS_ALLOWED_ORIGINS:*}

spring.security.user:
  name: admin
  password: ${ACTUATOR_PASSWORD}
  roles: ADMIN

logging:
  level:
    root: INFO
    com.starter: INFO
