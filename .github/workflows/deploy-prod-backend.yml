name: Deploy Backend to PROD

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Confirm production deployment (type "deploy" to proceed)'
        required: true
        default: 'no'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: starter-prod
  REGION: europe-west2
  ARTIFACT_REPOSITORY: starter
  IMAGE_NAME: starter-api
  SERVICE_NAME: starter-api-prod

defaults:
  run:
    working-directory: starter-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm_deploy == 'deploy'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_PROD }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Container
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_URI }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --service-account starter-api@starter-prod.iam.gserviceaccount.com \
            --set-env-vars "SPRING_PROFILES_ACTIVE=prod,GCP_PROJECT_ID=${{ env.PROJECT_ID }},STARTER_CORS_ALLOWED_ORIGINS=https://app.example.com" \
            --set-secrets "OPENAI_API_KEY=openai-api-key:latest,ACTUATOR_PASSWORD=actuator-password:latest" \
            --max-instances 20 \
            --memory 2Gi \
            --cpu 2
