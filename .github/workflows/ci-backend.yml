name: CI Backend

on:
  push:
    branches: [main, master]
    paths:
      - 'starter-backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'starter-backend/**'
      - '.github/workflows/ci-backend.yml'

defaults:
  run:
    working-directory: starter-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn clean test -B
