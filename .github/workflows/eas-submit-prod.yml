name: EAS Submit PROD

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'EAS build ID to submit (tested in DEV)'
        required: true
        type: string

defaults:
  run:
    working-directory: starter-mobile

jobs:
  submit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: starter-mobile/package-lock.json

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Submit to stores
        run: eas submit --platform all --id ${{ inputs.build_id }} --non-interactive
