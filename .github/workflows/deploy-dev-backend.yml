name: Deploy Backend to DEV

on:
  push:
    branches: [main, master]
    paths:
      - 'starter-backend/**'
      - '.github/workflows/deploy-dev-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: starter-dev
  REGION: europe-west2
  ARTIFACT_REPOSITORY: starter
  IMAGE_NAME: starter-api
  SERVICE_NAME: starter-api-dev

defaults:
  run:
    working-directory: starter-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Container
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_URI }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --service-account starter-api@starter-dev.iam.gserviceaccount.com \
            --set-env-vars "SPRING_PROFILES_ACTIVE=dev,GCP_PROJECT_ID=${{ env.PROJECT_ID }},STARTER_CORS_ALLOWED_ORIGINS=*" \
            --set-secrets "OPENAI_API_KEY=openai-api-key:latest,ACTUATOR_PASSWORD=actuator-password:latest" \
            --max-instances 5 \
            --memory 1Gi \
            --cpu 1
