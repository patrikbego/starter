name: CI Mobile

on:
  push:
    branches: [main, master]
    paths:
      - 'starter-mobile/**'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    paths:
      - 'starter-mobile/**'
      - '.github/workflows/ci-mobile.yml'

defaults:
  run:
    working-directory: starter-mobile

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: starter-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx expo lint

      - name: Typecheck
        run: npx tsc --noEmit
